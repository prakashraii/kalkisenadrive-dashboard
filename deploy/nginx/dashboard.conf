# Dashboard — Vite SPA in Docker on 127.0.0.1:3015
#
# After first copy to /etc/nginx/sites-available/, run:
#   sudo certbot --nginx -d kalkisenadrivedashboard.webstudiomatrix.com --redirect
# Certbot adds listen 443 ssl + certificates. Do NOT overwrite the live
# /etc/nginx file with this sample again or HTTPS breaks.

server {
    listen 80;
    server_name kalkisenadrivedashboard.webstudiomatrix.com;

    location / {
        proxy_pass http://127.0.0.1:3015;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
